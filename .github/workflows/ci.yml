name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test (UTC)
        run: dotnet test tests/MorningGateway.Tests
      - name: Test (US Eastern - catches time-zone bugs)
        run: TZ=America/New_York dotnet test tests/MorningGateway.Tests

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: dotnet workload install maui-android
      - name: Install Android SDK pieces
        run: dotnet build src/MorningGateway -f net10.0-android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$HOME/android-sdk" -p:AcceptAndroidSDKLicenses=True
      - name: Debug build
        run: dotnet build src/MorningGateway -f net10.0-android -p:AndroidSdkDirectory="$HOME/android-sdk"
