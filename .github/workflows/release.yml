name: Release

# Push a tag like v1.2.0 to build a signed APK and publish it as a GitHub Release.
# The app checks the release's latest.json to offer in-app updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test
        run: dotnet test tests/MorningGateway.Tests

      - run: dotnet workload install maui-android
      - name: Install Android SDK pieces
        run: dotnet build src/MorningGateway -f net10.0-android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$HOME/android-sdk" -p:AcceptAndroidSDKLicenses=True

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/MorningGateway -f net10.0-android -c Release \
            -p:AndroidSdkDirectory="$HOME/android-sdk" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.jks" \
            -p:AndroidSigningKeyAlias=morninggateway \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Collect APK and write latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIGNED=$(find src/MorningGateway/bin/Release -name '*-Signed.apk' | head -n1)
          test -n "$SIGNED"
          mkdir -p dist
          APK="dist/MorningGateway-$VERSION.apk"
          cp "$SIGNED" "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > dist/latest.json <<JSON
          {
            "versionCode": $GITHUB_RUN_NUMBER,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MorningGateway-$VERSION.apk",
            "sha256": "$SHA"
          }
          JSON
          cat dist/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
